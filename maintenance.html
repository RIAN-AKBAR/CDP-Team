<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>🚧 Maintenance - CDP Official</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="https://files.catbox.moe/7thi53.jpg">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{min-height:100%;overflow-x:hidden;}
body{
    background:#000;
    color:#e0e0e0;
    font-family:'Inter',sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:30px 20px;
    position:relative;
}

/* BACKGROUND */
.bg-wallpaper{
    position:fixed;inset:0;z-index:-2;
    background:radial-gradient(ellipse at 30% 40%,#1a0a2e,#0a0a0f,#050508);
    background-image:url('https://www.transparenttextures.com/patterns/dark-mosaic.png');
    background-blend-mode:overlay;
}
.bg-wallpaper::before{
    content:'';position:absolute;
    width:200%;height:200%;top:-50%;left:-50%;
    background:repeating-linear-gradient(45deg,rgba(106,13,173,0.03) 0px,rgba(106,13,173,0.03) 2px,transparent 2px,transparent 12px);
    animation:bgMove 40s linear infinite;
}
.bg-wallpaper::after{
    content:'';position:absolute;
    width:100%;height:100%;
    background:radial-gradient(circle at 80% 20%,rgba(106,13,173,0.15) 0%,transparent 70%);
    animation:bgPulse 8s ease-in-out infinite alternate;
}
@keyframes bgMove{0%{transform:translate(0,0) rotate(0deg);}100%{transform:translate(-5%,-5%) rotate(2deg);}}
@keyframes bgPulse{0%{opacity:0.3;}100%{opacity:0.8;}}

/* PARTICLES */
.particles{position:fixed;inset:0;z-index:-1;pointer-events:none;}
.particle{
    position:absolute;background:rgba(106,13,173,0.3);
    border-radius:50%;filter:blur(3px);
    animation:floatParticle 14s infinite alternate ease-in-out;
}
@keyframes floatParticle{
    0%{transform:translateY(0) translateX(0);opacity:0.1;}
    100%{transform:translateY(-70px) translateX(40px);opacity:0.4;}
}

/* CONTAINER */
.container{
    max-width:540px;width:100%;
    position:relative;z-index:2;text-align:center;
    animation:popIn 0.6s ease;
}
@keyframes popIn{
    0%{opacity:0;transform:translateY(20px) scale(0.95);}
    100%{opacity:1;transform:translateY(0) scale(1);}
}

/* RODA */
.wheel-container{
    width:180px;height:180px;position:relative;
    margin:0 auto 30px;
    animation:spinSlow 3s linear infinite;
    filter:drop-shadow(0 0 30px rgba(157,78,221,0.6));
}
@keyframes spinSlow{to{transform:rotate(360deg);}}
.tire{
    width:100%;height:100%;border-radius:50%;
    background:#000;border:14px solid #111;
    position:absolute;box-shadow:0 0 28px #9D4EDD;
}
.white-ring{
    position:absolute;top:50%;left:50%;
    width:70%;height:70%;
    transform:translate(-50%,-50%);
    border-radius:50%;border:6px solid #fff;
    box-shadow:0 0 10px #fff;z-index:2;
}
.hub{
    position:absolute;top:50%;left:50%;
    width:32%;height:32%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle,#E0AFFF 0%,#9D4EDD 70%,#5a1f99 100%);
    box-shadow:0 0 20px #fff;z-index:3;
}
.spokes{position:absolute;inset:0;z-index:1;}
.spoke-line{position:absolute;background:#fff;box-shadow:0 0 8px #fff;}
.spoke-line:nth-child(1){width:6px;height:58%;top:21%;left:50%;transform:translateX(-50%);}
.spoke-line:nth-child(2){width:58%;height:6px;top:50%;left:21%;transform:translateY(-50%);}
.spoke-line:nth-child(3){width:6px;height:58%;top:21%;left:50%;transform:translateX(-50%) rotate(45deg);}
.spoke-line:nth-child(4){width:6px;height:58%;top:21%;left:50%;transform:translateX(-50%) rotate(-45deg);}

/* TEXT */
.title{
    font-size:2rem;font-weight:900;letter-spacing:3px;
    text-transform:uppercase;
    background:linear-gradient(135deg,#e0e0e0,#c9a5ff,#a855f7);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:10px;
    filter:drop-shadow(0 0 20px rgba(168,85,247,0.5));
}
.subtitle{
    color:#a855f7;font-size:0.82rem;font-weight:700;
    letter-spacing:3px;text-transform:uppercase;
    margin-bottom:25px;
}

/* MESSAGE */
.message{
    color:#c8b8dd;font-size:0.92rem;line-height:1.7;
    padding:18px 22px;
    background:rgba(106,13,173,0.1);
    border:1px solid rgba(106,13,173,0.3);
    border-left:3px solid #a855f7;
    border-radius:12px;text-align:left;
    margin-bottom:25px;
}

/* AUTO REFRESH INFO */
.auto-info{
    display:flex;align-items:center;justify-content:center;
    gap:8px;
    padding:14px 20px;
    background:rgba(106,13,173,0.15);
    border:1px solid rgba(106,13,173,0.4);
    border-radius:12px;
    margin-bottom:25px;
    font-size:0.78rem;
    color:#c9a5ff;
    font-weight:600;
}
.auto-dot{
    width:8px;height:8px;border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 10px #22c55e;
    animation:pulseDot 1.5s infinite;
}
@keyframes pulseDot{
    0%,100%{opacity:1;transform:scale(1);}
    50%{opacity:0.4;transform:scale(0.8);}
}
.auto-info .count{
    color:#fff;
    font-weight:800;
    font-variant-numeric:tabular-nums;
    display:inline-block;
    min-width:20px;
    text-align:center;
}

/* BUTTONS */
.btn-group{
    display:flex;gap:10px;
    justify-content:center;flex-wrap:wrap;
    margin-bottom:25px;
}
.btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:13px 28px;border-radius:40px;
    color:white;font-weight:800;font-size:0.78rem;
    letter-spacing:1.5px;text-transform:uppercase;
    text-decoration:none;border:none;cursor:pointer;
    font-family:inherit;transition:0.25s;
}
.btn-primary{
    background:linear-gradient(135deg,#6a0dad,#8b2be0);
    box-shadow:0 0 25px rgba(168,85,247,0.6);
}
.btn-primary:hover{
    transform:translateY(-2px);
    box-shadow:0 0 35px rgba(168,85,247,0.9);
}
.btn-outline{
    background:transparent;
    border:1px solid rgba(106,13,173,0.5);
    color:#c9a5ff;
}
.btn-outline:hover{
    background:rgba(106,13,173,0.2);
    border-color:#a855f7;
}

/* NOTE */
.note{
    color:#666;font-size:0.72rem;
    line-height:1.6;letter-spacing:0.3px;
}
.note a{color:#a855f7;text-decoration:none;font-weight:700;}
.note a:hover{color:#c9a5ff;}

/* RESPONSIVE */
@media (max-width:550px){
    body{padding:20px 15px;}
    .wheel-container{width:140px;height:140px;margin-bottom:25px;}
    .tire{border-width:12px;}
    .white-ring{border-width:5px;}
    .title{font-size:1.4rem;letter-spacing:2px;}
    .subtitle{font-size:0.7rem;letter-spacing:2px;}
    .message{font-size:0.82rem;padding:15px 18px;}
    .btn{padding:11px 22px;font-size:0.7rem;}
    .auto-info{font-size:0.7rem;padding:12px 16px;}
}
@media (max-width:380px){
    .wheel-container{width:120px;height:120px;}
    .title{font-size:1.2rem;}
}
</style>
</head>
<body>

<div class="bg-wallpaper"></div>
<div class="particles" id="particles"></div>

<div class="container">
    <!-- RODA -->
    <div class="wheel-container">
        <div class="tire"></div>
        <div class="white-ring"></div>
        <div class="hub"></div>
        <div class="spokes">
            <div class="spoke-line"></div>
            <div class="spoke-line"></div>
            <div class="spoke-line"></div>
            <div class="spoke-line"></div>
        </div>
    </div>

    <h1 class="title">🚧 MAINTENANCE 🚧</h1>
    <p class="subtitle">⚡ CDP OFFICIAL ⚡</p>

    <div class="message" id="message">
        Mohon maaf, website CDP Official sedang dalam perbaikan untuk meningkatkan kualitas layanan kami. Kami akan segera kembali dalam waktu dekat!
    </div>

    <div class="auto-info" id="autoInfo">
        <span class="auto-dot"></span>
        <span>Auto-refresh dalam <span class="count" id="refreshCount">10</span> detik</span>
    </div>

    <div class="btn-group">
        <button class="btn btn-primary" onclick="location.reload()">🔄 REFRESH SEKARANG</button>
        <a href="#" id="waBtn" class="btn btn-outline" target="_blank">💬 HUBUNGI ADMIN</a>
    </div>

    <div class="note" id="note">
        Terima kasih atas kesabaran Anda 🙏<br>
        © 2023-<span id="year"></span> <a href="#">CDP OFFICIAL</a> | Roblox Community
    </div>
</div>

<script src="config.js"></script>

<script>
(function() {
    // ============ PARTICLES ============
    const particles = document.getElementById('particles');
    for (let i = 0; i < 50; i++) {
        let p = document.createElement('div');
        p.classList.add('particle');
        let s = Math.random() * 8 + 2;
        p.style.width = s + 'px';
        p.style.height = s + 'px';
        p.style.left = Math.random() * 100 + '%';
        p.style.top = Math.random() * 100 + '%';
        p.style.animationDuration = 10 + Math.random() * 20 + 's';
        p.style.animationDelay = Math.random() * 5 + 's';
        particles.appendChild(p);
    }

    // ============ LOAD CONFIG ============
    const CFG = (typeof CDP_CONFIG !== 'undefined') ? CDP_CONFIG : {};
    const MT = CFG.MAINTENANCE || {};

    // Override text dari config
    if (MT.PESAN) document.getElementById('message').textContent = MT.PESAN;
    if (MT.WA_ADMIN) document.getElementById('waBtn').href = MT.WA_ADMIN;
    if (MT.NOTE) {
        document.getElementById('note').innerHTML = 
            MT.NOTE + '<br>© 2023-' + new Date().getFullYear() + ' <a href="#">CDP OFFICIAL</a> | Roblox Community';
    }
    document.getElementById('year').textContent = new Date().getFullYear();

    // ============ AUTO REFRESH ============
    const REFRESH_DETIK = MT.AUTO_REFRESH_DETIK || 10;
    let counter = REFRESH_DETIK;
    const countEl = document.getElementById('refreshCount');
    
    if (countEl) countEl.textContent = counter;
    
    const refreshInterval = setInterval(function() {
        counter--;
        
        if (counter <= 0) {
            clearInterval(refreshInterval);
            console.log('%c🔄 AUTO REFRESH...', 'color:#22c55e;font-weight:bold;');
            location.reload();
            return;
        }
        
        if (countEl) countEl.textContent = counter;
    }, 1000);

    // ============ LOG ============
    console.log('%c🚧 MAINTENANCE PAGE 🚧', 'color:#ff6666;font-size:16px;font-weight:bold;');
    console.log('🔄 Auto refresh tiap:', REFRESH_DETIK + ' detik');
})();
</script>

</body>
</html>
