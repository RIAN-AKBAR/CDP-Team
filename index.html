<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDP Portal | Redirecting...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; color: #e0e0e0; font-family: 'Inter', sans-serif; overflow-x: hidden; min-height: 100vh; }

        /* ============================================
           PRELOADER: RODA BERPUTAR
           ============================================ */
        .preloader { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #000; display: flex; justify-content: center; align-items: center; z-index: 999999; transition: opacity 0.6s ease, visibility 0.6s ease; flex-direction: column; }
        .preloader.hide { opacity: 0; visibility: hidden; pointer-events: none; }
        .wheel-container { width: 220px; height: 220px; position: relative; animation: spin 0.8s linear infinite; margin: 0 auto; }
        .tire { width:100%; height:100%; border-radius:50%; background:#000; border:15px solid #111; position:absolute; box-shadow:0 0 28px #9D4EDD; }
        .white-ring { position:absolute; top:50%; left:50%; width:70%; height:70%; transform:translate(-50%,-50%); border-radius:50%; border:7px solid #fff; box-shadow:0 0 10px #fff; z-index:2; }
        .hub { position:absolute; top:50%; left:50%; width:32%; height:32%; transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(circle,#E0AFFF 0%,#9D4EDD 70%,#5a1f99 100%); box-shadow:0 0 20px #fff; z-index:3; }
        .spokes { position:absolute; top:0; left:0; width:100%; height:100%; z-index:1; }
        .spoke-line { position:absolute; background:#fff; box-shadow:0 0 8px #fff; }
        .spoke-line:nth-child(1) { width:6px; height:58%; top:21%; left:50%; transform:translateX(-50%); }
        .spoke-line:nth-child(2) { width:58%; height:6px; top:50%; left:21%; transform:translateY(-50%); }
        .spoke-line:nth-child(3) { width:6px; height:58%; top:21%; left:50%; transform:translateX(-50%) rotate(45deg); }
        .spoke-line:nth-child(4) { width:6px; height:58%; top:21%; left:50%; transform:translateX(-50%) rotate(-45deg); }
        @keyframes spin { to { transform: rotate(360deg); } }
        .welcome-text { margin-top: 25px; font-size: 24px; font-weight: bold; color: #fff; text-shadow: 0 0 12px #9D4EDD; letter-spacing: 4px; }
        .preloader-subtext { margin-top: 12px; font-size: 14px; color: #a855f7; }
        .glowing-line { width: 160px; height: 3px; background: linear-gradient(90deg,transparent,#9D4EDD,#c084fc,#9D4EDD,transparent); margin: 15px auto 0; border-radius: 4px; animation: blinkLine 0.8s infinite alternate; }
        @keyframes blinkLine { 0% { opacity: 0.3; width: 120px; } 100% { opacity: 1; width: 180px; } }
        @media (max-width: 550px) { .wheel-container { width: 170px; height: 170px; } .welcome-text { font-size: 18px; } .preloader-subtext { font-size: 11px; } }

        /* ============================================
           HALAMAN MAINTENANCE
           ============================================ */
        .maintenance-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(ellipse at 30% 40%, #1a0a2e, #0a0a0f, #050508); z-index: 9999999; display: none; justify-content: center; align-items: center; padding: 20px; overflow-y: auto; }
        .maintenance-overlay.active { display: flex; }
        .maintenance-overlay::before { content: ''; position: absolute; width: 200%; height: 200%; top: -50%; left: -50%; background: repeating-linear-gradient(45deg, rgba(106,13,173,0.05) 0px, rgba(106,13,173,0.05) 2px, transparent 2px, transparent 12px); animation: bgMove 40s linear infinite; pointer-events: none; }
        @keyframes bgMove { 0% { transform: translate(0,0) rotate(0deg); } 100% { transform: translate(-5%, -5%) rotate(2deg); } }
        .maintenance-content { position: relative; z-index: 2; text-align: center; max-width: 500px; width: 100%; background: rgba(10,10,18,0.85); backdrop-filter: blur(15px); border: 2px solid rgba(168,85,247,0.4); border-radius: 30px; padding: 45px 30px 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(168,85,247,0.2); animation: popInAds 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        @keyframes popInAds { 0% { transform: scale(0.5) rotate(-5deg); opacity: 0; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
        .maintenance-icon { font-size: 4.5rem; margin-bottom: 20px; display: inline-block; animation: maintSpin 3s linear infinite; filter: drop-shadow(0 0 20px rgba(168,85,247,0.8)); }
        @keyframes maintSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .maintenance-title { font-size: 1.9rem; font-weight: 800; background: linear-gradient(120deg, #e0e0e0, #c9a5ff, #a855f7); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 15px; letter-spacing: 1px; }
        .maintenance-message { font-size: 1rem; color: #d0d0d0; line-height: 1.7; margin-bottom: 20px; }
        .maintenance-estimated { display: inline-block; background: rgba(168,85,247,0.15); border: 1px solid rgba(168,85,247,0.4); border-radius: 40px; padding: 8px 20px; font-size: 0.85rem; color: #c9a5ff; font-weight: 600; margin-bottom: 25px; }
        .maintenance-countdown { display: flex; justify-content: center; gap: 12px; margin: 25px 0; flex-wrap: wrap; }
        .countdown-box { background: linear-gradient(135deg, #1a0a2e, #0d0d1a); border: 1px solid rgba(168,85,247,0.5); border-radius: 15px; padding: 12px 16px; min-width: 70px; box-shadow: 0 5px 15px rgba(0,0,0,0.4), 0 0 10px rgba(168,85,247,0.15); }
        .countdown-num { font-size: 1.6rem; font-weight: 800; color: #c9a5ff; line-height: 1; }
        .countdown-label { font-size: 0.65rem; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; }
        .maintenance-contact { display: flex; justify-content: center; gap: 12px; margin-top: 25px; flex-wrap: wrap; }
        .maint-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 22px; border-radius: 40px; text-decoration: none; color: white; font-weight: bold; font-size: 0.85rem; transition: 0.2s; border: none; cursor: pointer; }
        .maint-btn-discord { background: #5865F2; box-shadow: 0 5px 15px rgba(88,101,242,0.4); }
        .maint-btn-discord:hover { background: #4752c4; transform: scale(1.05); }
        .maint-btn-wa { background: #25D366; box-shadow: 0 5px 15px rgba(37,211,102,0.4); }
        .maint-btn-wa:hover { background: #1da851; transform: scale(1.05); }
        .maintenance-footer { margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(168,85,247,0.2); font-size: 0.7rem; color: #666; }
        .maint-pulse { display: inline-block; width: 10px; height: 10px; background: #ff0050; border-radius: 50%; margin-right: 8px; animation: pulseDot 1.5s ease-in-out infinite; vertical-align: middle; }
        @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } }
        @media (max-width: 550px) { .maintenance-content { padding: 35px 20px 30px; border-radius: 24px; } .maintenance-icon { font-size: 3.5rem; } .maintenance-title { font-size: 1.4rem; } .maintenance-message { font-size: 0.9rem; } .maintenance-estimated { font-size: 0.75rem; padding: 6px 16px; } .countdown-box { min-width: 60px; padding: 10px 12px; } .countdown-num { font-size: 1.3rem; } .countdown-label { font-size: 0.55rem; } .maint-btn { padding: 8px 18px; font-size: 0.75rem; } }
    </style>
</head>
<body>

    <!-- ============================================
         1. PRELOADER (RODA BERPUTAR)
         ============================================ -->
    <div id="preloader" class="preloader">
        <div class="wheel-container">
            <div class="tire"></div>
            <div class="white-ring"></div>
            <div class="hub"></div>
            <div class="spokes">
                <div class="spoke-line"></div>
                <div class="spoke-line"></div>
                <div class="spoke-line"></div>
                <div class="spoke-line"></div>
            </div>
        </div>
        <div class="welcome-text">WELCOME TO CDP</div>
        <div class="preloader-subtext">⚡ CDP OFFICIAL ⚡</div>
        <div class="glowing-line"></div>
        <div style="color:#888;font-size:12px;margin-top:12px;">Redirecting...</div>
    </div>

    <!-- ============================================
         2. HALAMAN MAINTENANCE
         ============================================ -->
    <div class="maintenance-overlay" id="maintenanceOverlay">
        <div class="maintenance-content">
            <div class="maintenance-icon">🛠️</div>
            <h1 class="maintenance-title" id="maintTitle">🛠️ SEDANG MAINTENANCE</h1>
            <p class="maintenance-message" id="maintMessage">Kami sedang melakukan perbaikan sistem.</p>
            <div class="maintenance-estimated" id="maintEstimated"><span class="maint-pulse"></span> Akan kembali dalam waktu dekat</div>
            
            <div class="maintenance-countdown" id="maintCountdown" style="display:none;">
                <div class="countdown-box"><div class="countdown-num" id="cdDays">00</div><div class="countdown-label">Hari</div></div>
                <div class="countdown-box"><div class="countdown-num" id="cdHours">00</div><div class="countdown-label">Jam</div></div>
                <div class="countdown-box"><div class="countdown-num" id="cdMins">00</div><div class="countdown-label">Menit</div></div>
                <div class="countdown-box"><div class="countdown-num" id="cdSecs">00</div><div class="countdown-label">Detik</div></div>
            </div>

            <div class="maintenance-contact" id="maintContact" style="display:none;">
                <a id="maintDiscordBtn" href="#" target="_blank" class="maint-btn maint-btn-discord">💬 DISCORD</a>
                <a id="maintWaBtn" href="#" target="_blank" class="maint-btn maint-btn-wa">📱 WHATSAPP</a>
            </div>
            <div class="maintenance-footer">
                <p>© 2023-2026 CDP OFFICIAL</p>
                <p style="margin-top:5px;">Terima kasih atas kesabaran Anda 🙏</p>
            </div>
        </div>
    </div>

    <!-- Panggil File Konfigurasi -->
    <script src="config.js"></script>

    <!-- ============================================
         3. LOGIKA UTAMA (MENGATUR SEMUA)
         ============================================ -->
    <script>
        (function() {
            // A. SEMBUNYIKAN PRELOADER
            const preloader = document.getElementById('preloader');
            let isHidden = false;
            function hidePreloader() {
                if (isHidden) return;
                isHidden = true;
                preloader.classList.add('hide');
                setTimeout(() => { preloader.style.display = 'none'; }, 700);
            }
            if (document.readyState === 'complete') { setTimeout(hidePreloader, 300); } 
            else { window.addEventListener('load', () => setTimeout(hidePreloader, 300)); }
            setTimeout(hidePreloader, 3000);

            // B. CEK MAINTENANCE DARI CONFIG.JS
            const maintOverlay = document.getElementById('maintenanceOverlay');

            if (isMaintenance()) {
                // AKTIFKAN HALAMAN MAINTENANCE (TIDAK REDIRECT)
                maintOverlay.classList.add('active');

                const m = CDP_CONFIG.MAINTENANCE;
                document.getElementById('maintTitle').innerText = m.TITLE;
                document.getElementById('maintMessage').innerText = m.MESSAGE;
                document.getElementById('maintEstimated').innerHTML = '<span class="maint-pulse"></span> ' + m.ESTIMATED;

                // Setup Countdown (Jika diisi di config)
                if (m.ETA_TIME) {
                    const countdownEl = document.getElementById('maintCountdown');
                    countdownEl.style.display = 'flex';
                    const target = new Date(m.ETA_TIME).getTime();
                    
                    function updateCountdown() {
                        const diff = target - new Date().getTime();
                        if (diff <= 0) return;
                        document.getElementById('cdDays').innerText = String(Math.floor(diff / 86400000)).padStart(2, '0');
                        document.getElementById('cdHours').innerText = String(Math.floor((diff % 86400000) / 3600000)).padStart(2, '0');
                        document.getElementById('cdMins').innerText = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
                        document.getElementById('cdSecs').innerText = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
                    }
                    updateCountdown();
                    setInterval(updateCountdown, 1000);
                }

                // Setup Kontak (Discord & WA)
                const contactEl = document.getElementById('maintContact');
                let showContact = false;
                if (m.CONTACT_DISCORD) {
                    document.getElementById('maintDiscordBtn').href = getDiscordRegisterUrl();
                    showContact = true;
                } else {
                    document.getElementById('maintDiscordBtn').style.display = 'none';
                }
                if (m.CONTACT_WA) {
                    document.getElementById('maintWaBtn').href = getWhatsAppUrl('Halo admin, saya mau tanya soal maintenance CDP');
                    showContact = true;
                } else {
                    document.getElementById('maintWaBtn').style.display = 'none';
                }
                if (showContact) contactEl.style.display = 'flex';

            } else {
                // C. JIKA TIDAK MAINTENANCE, LANGSUNG REDIRECT KE CLOUDFLARE TUNNEL
                const tunnelLink = getCloudflaredLink();
                
                // Redirect Otomatis setelah 1.5 detik (memberi waktu preloader berputar)
                setTimeout(() => {
                    window.location.href = tunnelLink;
                }, 1500);
            }

        })();
    </script>
</body>
</html>
